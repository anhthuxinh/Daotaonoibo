<section class="slide aqua" data-title="Chọn chủ đề"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e20" contenteditable="false">01 · Chọn chủ đề</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">03 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e21" contenteditable="false">Điều gì khó khăn nhất khi <span class="orange">tổ chức đào tạo?</span></h2><p class="subtitle" data-edit="" data-eid="e22" contenteditable="false">Bắt đầu từ giá trị, không bắt đầu từ số lượng slide.</p></header><div class="body split"><div class="venn" data-reveal=""><div class="circle c1" data-component="" data-edit="" data-cid="c5" data-eid="e23" contenteditable="false">Tôi có<br>kinh nghiệm</div><div class="circle c2" data-component="" data-edit="" data-cid="c6" data-eid="e24" contenteditable="false">Người học<br>đang cần</div><div class="circle c3" data-component="" data-edit="" data-cid="c7" data-eid="e25" contenteditable="false">Có thể<br>áp dụng</div><div class="center" data-edit="" data-eid="e26" contenteditable="false">CHỦ ĐỀ<br>ĐÁNG DẠY</div></div><div style="display:grid;gap:1vw"><div class="card lift" data-component="" data-reveal="" style="--i: 2; transform: translate(0px, 0px); font-size: 18px;" data-cid="c8" data-x="0" data-y="0"><span class="pill">Câu hỏi mở khóa</span><p class="quote" data-edit="" style="margin-top:1em" data-eid="e27" contenteditable="false">Sau buổi học, người học sẽ làm được điều gì khác đi trong công việc?</p></div><div class="card" data-component="" data-reveal="" data-cid="c9"><p data-edit="" data-eid="e28" contenteditable="false">Nếu chưa trả lời được bằng một hành động quan sát được, chủ đề vẫn còn quá rộng.</p></div></div></div></div></section><section class="slide" data-title="Sáu câu hỏi định vị"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e29" contenteditable="false">01 · Chọn chủ đề</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">04 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e30" contenteditable="false">Sáu câu hỏi <span class="accent">định vị</span></h2><p class="subtitle" data-edit="" data-eid="e31" contenteditable="false">Trả lời ngắn, cụ thể và gần với việc thật.</p></header><div class="body grid6"><article class="card lift" data-component="" data-reveal="" style="--i:0;" data-cid="c10"><span class="num">01</span><h3 data-edit="" data-eid="e32" contenteditable="false">Thế mạnh nào?</h3><p data-edit="" data-eid="e33" contenteditable="false">Việc đã làm nhiều lần hoặc bài học đã trả giá.</p></article><article class="card lift" data-component="" data-reveal="" style="--i:1;--component-accent:var(--orange)" data-cid="c11"><span class="num">02</span><h3 data-edit="" data-eid="e34" contenteditable="false">Chia sẻ gì?</h3><p data-edit="" data-eid="e35" contenteditable="false">Một câu, một chủ đề — không gom mọi điều mình biết.</p></article><article class="card lift" data-component="" data-reveal="" style="--i:2;" data-cid="c12"><span class="num">03</span><h3 data-edit="" data-eid="e36" contenteditable="false">Giải quyết gì?</h3><p data-edit="" data-eid="e37" contenteditable="false">Lỗi lặp lại, lãng phí, chất lượng hay quyết định khó.</p></article><article class="card lift" data-component="" data-reveal="" style="--i:3;--component-accent:var(--orange)" data-cid="c13"><span class="num">04</span><h3 data-edit="" data-eid="e38" contenteditable="false">Làm được gì?</h3><p data-edit="" data-eid="e39" contenteditable="false">Chọn, phân tích, kiểm tra, thiết kế hoặc xử lý.</p></article><article class="card lift" data-component="" data-reveal="" style="--i:4;" data-cid="c14"><span class="num">05</span><h3 data-edit="" data-eid="e40" contenteditable="false">Tổ chức cách nào?</h3><p data-edit="" data-eid="e41" contenteditable="false">Minh họa, tình huống, hướng dẫn hoặc thực hành.</p></article><article class="card lift" data-component="" data-reveal="" style="--i:5;--component-accent:var(--orange)" data-cid="c15"><span class="num">06</span><h3 data-edit="" data-eid="e42" contenteditable="false">Tham gia ra sao?</h3><p data-edit="" data-eid="e43" contenteditable="false">Bình chọn, trao đổi, sắp xếp, phản hồi.</p></article></div></div></section><section class="slide warm" data-title="Thu hẹp chủ đề"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e44" contenteditable="false">01 · Chọn chủ đề</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">05 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e45" contenteditable="false">Điều tôi biết <span class="orange">≠</span> điều người học cần</h2><p class="subtitle" data-edit="" data-eid="e46" contenteditable="false">Thu hẹp để tạo tác động.</p></header><div class="body versus"><div class="side wide lift" data-component="" data-cid="c16"><span class="eyebrow">Phía người dạy</span><h3 data-edit="" data-eid="e47" contenteditable="false">Điều tôi biết</h3><ul><li data-edit="" data-eid="e48" contenteditable="false">Rộng</li><li data-edit="" data-eid="e49" contenteditable="false">Nhiều chi tiết</li><li data-edit="" data-eid="e50" contenteditable="false">Dễ dàn trải</li></ul></div><div class="sign">≠</div><div class="side focus lift" data-component="" data-cid="c17"><span class="eyebrow">Phía người học</span><h3 data-edit="" data-eid="e51" contenteditable="false">Điều cần học</h3><ul><li data-edit="" data-eid="e52" contenteditable="false">Một việc</li><li data-edit="" data-eid="e53" contenteditable="false">Một thay đổi</li><li data-edit="" data-eid="e54" contenteditable="false">Một bằng chứng</li></ul></div></div><div class="quote" data-edit="" style="margin-top:1vw" data-eid="e55" contenteditable="false">Đừng dạy “toàn bộ chủ đề”. Hãy dạy đúng phần giúp người học hoàn thành một nhiệm vụ cụ thể.</div></div></section><section class="slide aqua" data-title="Hoạt động chọn chủ đề"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e56" contenteditable="false">01 · Hoạt động</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">06 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e57" contenteditable="false">Xác định đề bài của bạn</h2><p class="subtitle" data-edit="" data-eid="e58" contenteditable="false">Kéo các thẻ vào đúng ô để hoàn thiện câu mô tả bài học.</p></header><div class="body activity-shell"><aside class="brief custom-cursor-on-hover" data-component="" data-cid="c18"><span class="pill">Bài tập kéo–thả</span><h3 data-edit="" data-eid="e59" contenteditable="false">Một bài học rõ ràng cần trả lời 4 câu hỏi</h3><p data-edit="" data-eid="e60" contenteditable="false">• Dạy cho ai?<br>• Họ sẽ làm được gì?<br>• Áp dụng trong bối cảnh nào?<br>• Học bằng cách nào?<br><br><strong>Câu mẫu sau khi hoàn thành:</strong><br>“Tôi sẽ giúp nhân viên tài năng chuẩn bị giảng dạy nội bộ thiết kế một nội dung học 15 phút về một chủ đề chuyên môn đang cần chia sẻ tại PVEP, bằng khung 4W–1H, công thức 1–3–1 và một hoạt động kiểm tra mức độ hiểu bài.”</p></aside><div class="workspace" data-activity=""><div class="bank"><div class="drag-card" draggable="true" data-key="context" data-edit="" data-eid="e61" contenteditable="false">Một chủ đề chuyên môn đang cần chia sẻ tại PVEP</div><div class="drag-card" draggable="true" data-key="action" data-edit="" data-eid="e62" contenteditable="false">“Thiết kế một nội dung học 15 phút về chủ đề này”</div><div class="drag-card" draggable="true" data-key="audience" data-edit="" data-eid="e63" contenteditable="false">Nhân viên tài năng chuẩn bị giảng dạy nội bộ</div><div class="drag-card" draggable="true" data-key="core" data-edit="" data-eid="e64" contenteditable="false">4W–1H, công thức 1–3–1 và bằng chứng học tập</div></div><div class="drop-grid" style=""><div class="drop-zone" data-accept="audience"><span class="drop-label">NGƯỜI HỌC</span></div><div class="drop-zone" data-accept="action"><span class="drop-label">VIỆC NGƯỜI HỌC CẦN LÀM</span></div><div class="drop-zone" data-accept="context"><span class="drop-label">BỐI CẢNH</span></div><div class="drop-zone" data-accept="core"><span class="drop-label">CÁCH THỰC HIỆN</span></div></div><div class="actions"><button class="action primary check">Kiểm tra</button><button class="action ghost reset">Làm lại</button><span class="feedback" aria-live="polite"></span></div></div></div></div></section><section class="slide" data-title="Bốn câu hỏi về người học"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e65" contenteditable="false">02 · Chuẩn bị</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">07 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e66" contenteditable="false">Bốn câu hỏi về <span class="accent">người học</span></h2><p class="subtitle" data-edit="" data-eid="e67" contenteditable="false">Đúng đối tượng · đúng trình độ · đúng nhu cầu · đúng bối cảnh.</p></header><div class="body grid4"><article class="card lift" data-component="" data-reveal="" style="--i:0;" data-cid="c19"><span class="num">01</span><h3 data-edit="" data-eid="e68" contenteditable="false">Họ là ai?</h3><p data-edit="" data-eid="e69" contenteditable="false">Vai trò, kinh nghiệm, mức hiểu biết nền và lý do tham gia.</p><div class="rule"></div><span class="pill" data-edit="" data-eid="e70" contenteditable="false">Đúng đối tượng</span></article><article class="card lift" data-component="" data-reveal="" style="--i:1;--component-accent:var(--orange)" data-cid="c20"><span class="num">02</span><h3 data-edit="" data-eid="e71" contenteditable="false">Họ đã biết gì?</h3><p data-edit="" data-eid="e72" contenteditable="false">Điều có thể lược bớt; thuật ngữ nào cần giải thích.</p><div class="rule"></div><span class="pill" data-edit="" data-eid="e73" contenteditable="false">Đúng trình độ</span></article><article class="card lift" data-component="" data-reveal="" style="--i:2;" data-cid="c21"><span class="num">03</span><h3 data-edit="" data-eid="e74" contenteditable="false">Họ đang vướng gì?</h3><p data-edit="" data-eid="e75" contenteditable="false">Nhiệm vụ khó, lỗi lặp lại, quyết định làm mất thời gian.</p><div class="rule"></div><span class="pill" data-edit="" data-eid="e76" contenteditable="false">Đúng nhu cầu</span></article><article class="card lift" data-component="" data-reveal="" style="--i:3;--component-accent:var(--orange)" data-cid="c22"><span class="num">04</span><h3 data-edit="" data-eid="e77" contenteditable="false">Họ sẽ dùng ở đâu?</h3><p data-edit="" data-eid="e78" contenteditable="false">Tình huống cho phép áp dụng ngay sau buổi học.</p><div class="rule"></div><span class="pill" data-edit="" data-eid="e79" contenteditable="false">Đúng bối cảnh</span></article></div><div class="micro" data-edit="" data-eid="e80" contenteditable="false">Hỏi nhanh trước lớp: Công việc hiện tại? Điều khó nhất? Cách làm muốn mang về?</div></div></section><section class="slide dark" data-title="Sáu việc chuẩn bị"><div class="mesh"></div><div class="slash"></div><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e81" contenteditable="false">02 · Chuẩn bị</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">08 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e82" contenteditable="false">Sáu việc phải <span class="accent">chuẩn bị</span></h2><p class="subtitle" data-edit="" data-eid="e83" contenteditable="false">Một trang trước khi bắt đầu làm slide.</p></header><div class="body grid6"><article class="card lift" data-component="" data-reveal="" style="--i:0;" data-cid="c23"><span class="num">01</span><h3 data-edit="" data-eid="e84" contenteditable="false">Mục tiêu</h3><p data-edit="" data-eid="e85" contenteditable="false">Hành động · tình huống · tiêu chí</p></article><article class="card lift" data-component="" data-reveal="" style="--i:1;--component-accent:var(--orange)" data-cid="c24"><span class="num">02</span><h3 data-edit="" data-eid="e86" contenteditable="false">Nguồn &amp; ví dụ</h3><p data-edit="" data-eid="e87" contenteditable="false">Tài liệu gốc · người kiểm tra</p></article><article class="card lift" data-component="" data-reveal="" style="--i:2;" data-cid="c25"><span class="num">03</span><h3 data-edit="" data-eid="e88" contenteditable="false">Phạm vi</h3><p data-edit="" data-eid="e89" contenteditable="false">Bắt buộc · nên biết · tham khảo</p></article><article class="card lift" data-component="" data-reveal="" style="--i:3;--component-accent:var(--orange)" data-cid="c26"><span class="num">04</span><h3 data-edit="" data-eid="e90" contenteditable="false">Tương tác</h3><p data-edit="" data-eid="e91" contenteditable="false">Hỏi · tình huống · thực hành</p></article><article class="card lift" data-component="" data-reveal="" style="--i:4;" data-cid="c27"><span class="num">05</span><h3 data-edit="" data-eid="e92" contenteditable="false">Kiểm tra</h3><p data-edit="" data-eid="e93" contenteditable="false">Câu trả lời · quyết định · sản phẩm</p></article><article class="card lift" data-component="" data-reveal="" style="--i:5;--component-accent:var(--orange)" data-cid="c28"><span class="num">06</span><h3 data-edit="" data-eid="e94" contenteditable="false">Dự phòng</h3><p data-edit="" data-eid="e95" contenteditable="false">Thiết bị · mạng · phương án offline</p></article></div></div></section><section class="slide warm" data-title="Hoạt động chuẩn bị"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e96" contenteditable="false">02 · Hoạt động</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">09 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e97" contenteditable="false">Bản chuẩn bị trước buổi học</h2><p class="subtitle" data-edit="" data-eid="e98" contenteditable="false">Kéo từng thẻ vào đúng phần trong kế hoạch chuẩn bị.</p></header><div class="body activity-shell"><aside class="brief custom-cursor-on-hover" data-component="" data-cid="c29"><span class="pill">Bài tập kéo–thả</span><h3 data-edit="" data-eid="e99" contenteditable="false">Chuẩn bị đủ để dạy tự tin</h3><p data-edit="" data-eid="e100" contenteditable="false">Xác định rõ mục tiêu, nội dung, hoạt động và phương án dự phòng trước khi bắt đầu.</p></aside><div class="workspace" data-activity=""><div class="bank"><div class="drag-card" draggable="true" data-key="goal" data-edit="" data-eid="e101" contenteditable="false">Nội dung học 15 phút có mục tiêu, dàn bài và tương tác</div><div class="drag-card" draggable="true" data-key="source" data-edit="" data-eid="e102" contenteditable="false">Giáo án · chuẩn chất lượng · tài liệu active learning</div><div class="drag-card" draggable="true" data-key="scope" data-edit="" data-eid="e103" contenteditable="false">Bắt buộc: 4W–1H, 1–3–1, tương tác</div><div class="drag-card" draggable="true" data-key="interact" data-edit="" data-eid="e104" contenteditable="false">Bình chọn · trao đổi cặp · sắp xếp thẻ</div><div class="drag-card" draggable="true" data-key="check" data-edit="" data-eid="e105" contenteditable="false">Một câu chủ đề + một cấu trúc 1–3–1 hoàn chỉnh</div><div class="drag-card" draggable="true" data-key="backup" data-edit="" data-eid="e106" contenteditable="false">PDF · thẻ A/B/C · phiếu giấy · ảnh minh họa</div></div><div class="drop-grid" style="grid-template-columns:repeat(3,1fr)"><div class="drop-zone" data-accept="goal"><span class="drop-label">Mục tiêu</span></div><div class="drop-zone" data-accept="source"><span class="drop-label">Nguồn</span></div><div class="drop-zone" data-accept="scope"><span class="drop-label">Phạm vi</span></div><div class="drop-zone" data-accept="interact"><span class="drop-label">Tương tác</span></div><div class="drop-zone" data-accept="check"><span class="drop-label">Kiểm tra</span></div><div class="drop-zone" data-accept="backup"><span class="drop-label">Dự phòng</span></div></div><div class="actions"><button class="action primary check">Kiểm tra</button><button class="action ghost reset">Làm lại</button><span class="feedback" aria-live="polite"></span></div></div></div></div></section><section class="slide aqua" data-title="Khung 4W–1H"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e107" contenteditable="false">03 · Xây nội dung</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">10 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e108" contenteditable="false">Khung <span class="orange">4W–1H</span></h2><p class="subtitle" data-edit="" data-eid="e109" contenteditable="false">Năm câu hỏi biến chuyên môn thành hành trình học.</p></header><div class="body"><div class="framework"><article class="unit" data-component="" data-cid="c30"><div class="letter">W</div><h3 data-edit="" data-eid="e110" contenteditable="false">WHY · Vì sao?</h3><p data-edit="" data-eid="e111" contenteditable="false">Vấn đề nào cần giải quyết?</p></article><article class="unit" data-component="" data-cid="c31"><div class="letter">W</div><h3 data-edit="" data-eid="e112" contenteditable="false">WHAT · Học gì?</h3><p data-edit="" data-eid="e113" contenteditable="false">Nội dung nào thực sự cần?</p></article><article class="unit" data-component="" data-cid="c32"><div class="letter">W</div><h3 data-edit="" data-eid="e114" contenteditable="false">WHO · Cho ai?</h3><p data-edit="" data-eid="e115" contenteditable="false">Trình độ và ví dụ nào phù hợp?</p></article><article class="unit" data-component="" data-cid="c33"><div class="letter">H</div><h3 data-edit="" data-eid="e116" contenteditable="false">HOW · Học thế nào?</h3><p data-edit="" data-eid="e117" contenteditable="false">Nhớ gì và làm gì ở mỗi khối?</p></article><article class="unit" data-component="" data-cid="c34"><div class="letter">W</div><h3 data-edit="" data-eid="e118" contenteditable="false">WHEN · Dùng khi nào?</h3><p data-edit="" data-eid="e119" contenteditable="false">Áp dụng ở tình huống công việc nào?</p></article></div><div class="quote" data-edit="" data-eid="e120" contenteditable="false">Thiết kế từ WHY và WHEN trước khi mở PowerPoint.</div></div></div></section><section class="slide" data-title="Ví dụ 4W–1H"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e121" contenteditable="false">03 · Ví dụ xuyên suốt</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">11 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e122" contenteditable="false">4W–1H của chính <span class="accent">khóa học này</span></h2><p class="subtitle" data-edit="" data-eid="e123" contenteditable="false">Nhìn cách một chủ đề được đóng khung trước khi làm slide.</p></header><div class="body grid5"><article class="card lift" data-component="" data-reveal="" style="--i:0;" data-cid="c35"><span class="num">WHY</span><h3 data-edit="" data-eid="e124" contenteditable="false">Bài giảng nội bộ thường nhiều kiến thức nhưng khó áp dụng.</h3><p data-edit="" data-eid="e125" contenteditable="false">Một mục tiêu cốt lõi</p></article><article class="card lift" data-component="" data-reveal="" style="--i:1;--component-accent:var(--orange)" data-cid="c36"><span class="num">WHAT</span><h3 data-edit="" data-eid="e126" contenteditable="false">Chọn chủ đề, chuẩn bị, 4W–1H, 1–3–1 và dẫn dắt lớp.</h3><p data-edit="" data-eid="e127" contenteditable="false">Các ý bắt buộc</p></article><article class="card lift" data-component="" data-reveal="" style="--i:2;" data-cid="c37"><span class="num">WHO</span><h3 data-edit="" data-eid="e128" contenteditable="false">Nhân viên tài năng có chuyên môn, chưa nhiều kinh nghiệm đứng lớp.</h3><p data-edit="" data-eid="e129" contenteditable="false">Mức độ &amp; ví dụ</p></article><article class="card lift" data-component="" data-reveal="" style="--i:3;--component-accent:var(--orange)" data-cid="c38"><span class="num">HOW</span><h3 data-edit="" data-eid="e130" contenteditable="false">Khối ngắn, ví dụ xuyên suốt, thực hành và phản hồi theo cặp.</h3><p data-edit="" data-eid="e131" contenteditable="false">Các khối 1–3–1</p></article><article class="card lift" data-component="" data-reveal="" style="--i:4;" data-cid="c39"><span class="num">WHEN</span><h3 data-edit="" data-eid="e132" contenteditable="false">Áp dụng ngay khi chuẩn bị buổi chia sẻ chuyên môn tại PVEP.</h3><p data-edit="" data-eid="e133" contenteditable="false">Bước sau buổi học</p></article></div></div></section><section class="slide warm" data-title="Công thức 1–3–1"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e134" contenteditable="false">03 · Xây nội dung</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">12 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e135" contenteditable="false">Công thức <span class="orange">1–3–1</span></h2><p class="subtitle" data-edit="" data-eid="e136" contenteditable="false">Một khối học 10–15 phút có nhịp rõ ràng.</p></header><div class="body formula"><article class="block" data-component="" data-cid="c40"><div class="big">1</div><div><h3 data-edit="" data-eid="e137" contenteditable="false">Thông điệp</h3><p data-edit="" data-eid="e138" contenteditable="false">Nếu chỉ nhớ một điều, đó là gì?</p></div></article><div class="plus">+</div><article class="block mid" data-component="" data-cid="c41"><div class="big">3</div><div><h3 data-edit="" data-eid="e139" contenteditable="false">Ý hỗ trợ</h3><p data-edit="" data-eid="e140" contenteditable="false">Tối đa ba bước, lý do, bằng chứng hoặc nguyên tắc.</p></div></article><div class="plus">+</div><article class="block" data-component="" data-cid="c42"><div class="big">1</div><div><h3 data-edit="" data-eid="e141" contenteditable="false">Việc phải làm</h3><p data-edit="" data-eid="e142" contenteditable="false">Trả lời, lựa chọn, sửa, sắp xếp hoặc thực hành.</p></div></article></div><div class="quote" data-edit="" data-eid="e143" contenteditable="false">Một thông điệp rõ + vừa đủ hỗ trợ + một hành động tạo bằng chứng.</div></div></section><section class="slide dark" data-title="Bốn khung dàn bài"><div class="mesh"></div><div class="slash"></div><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e144" contenteditable="false">03 · Xây nội dung</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">13 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e145" contenteditable="false">Bốn khung dàn bài <span class="accent">dễ áp dụng</span></h2><p class="subtitle" data-edit="" data-eid="e146" contenteditable="false">Chọn cấu trúc theo nhiệm vụ người học.</p></header><div class="body grid4"><article class="card lift" data-component="" data-reveal="" style="--i:0;" data-cid="c43"><span class="num">01</span><h3 data-edit="" data-eid="e147" contenteditable="false">Theo quy trình</h3><p data-edit="" data-eid="e148" contenteditable="false">Thao tác hoặc công việc có trình tự.</p><div class="rule"></div><span class="pill" data-edit="" data-eid="e149" contenteditable="false">Bước 1 → 2 → 3</span></article><article class="card lift" data-component="" data-reveal="" style="--i:1;--component-accent:var(--orange)" data-cid="c44"><span class="num">02</span><h3 data-edit="" data-eid="e150" contenteditable="false">Vấn đề → xử lý</h3><p data-edit="" data-eid="e151" contenteditable="false">Lỗi, nguyên nhân, rủi ro và phương án.</p><div class="rule"></div><span class="pill" data-edit="" data-eid="e152" contenteditable="false">Lỗi → Vì sao → Sửa</span></article><article class="card lift" data-component="" data-reveal="" style="--i:2;" data-cid="c45"><span class="num">03</span><h3 data-edit="" data-eid="e153" contenteditable="false">Khái niệm → áp dụng</h3><p data-edit="" data-eid="e154" contenteditable="false">Kiến thức mới, minh họa rồi thử dùng.</p><div class="rule"></div><span class="pill" data-edit="" data-eid="e155" contenteditable="false">Hiểu → Thử → Chốt</span></article><article class="card lift" data-component="" data-reveal="" style="--i:3;--component-accent:var(--orange)" data-cid="c46"><span class="num">04</span><h3 data-edit="" data-eid="e156" contenteditable="false">Tình huống → bài học</h3><p data-edit="" data-eid="e157" contenteditable="false">Lớp có kinh nghiệm, phân tích trước.</p><div class="rule"></div><span class="pill" data-edit="" data-eid="e158" contenteditable="false">Tình huống → Nguyên tắc</span></article></div></div></section><section class="slide aqua" data-title="Hoạt động 1–3–1"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e159" contenteditable="false">03 · Hoạt động</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">14 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e160" contenteditable="false">Từ chủ đề đến phạm vi bài học</h2><p class="subtitle" data-edit="" data-eid="e161" contenteditable="false">Kéo các thẻ vào đúng nhóm.</p></header><div class="body activity-shell"><aside class="brief custom-cursor-on-hover" data-component="" data-cid="c47"><span class="pill">Bài tập kéo–thả</span><h3 data-edit="" data-eid="e162" contenteditable="false">Xác định nội dung cần dạy trong bài học</h3><p data-edit="" data-eid="e163" contenteditable="false">Một bài học không cần bao quát tất cả. Hãy chọn nội dung giúp người học thực hiện được một việc cụ thể trong một bối cảnh cụ thể.</p></aside><div class="workspace" data-activity=""><div class="bank"></div><div class="drop-grid" style=""><div class="drop-zone correct" data-accept="must"><span class="drop-label">Cần học trên lớp</span><div class="drag-card" draggable="true" data-key="must" data-edit="" data-eid="e168" contenteditable="false">Một tương tác demo</div><div class="drag-card" draggable="true" data-key="must" data-edit="" data-eid="e164" contenteditable="false">Khung 4W–1H</div><div class="drag-card" draggable="true" data-key="must" data-edit="" data-eid="e166" contenteditable="false">Công thức 1–3–1</div></div><div class="drop-zone correct" data-accept="ref"><span class="drop-label">Để tham khảo</span><div class="drag-card" draggable="true" data-key="ref" data-edit="" data-eid="e169" contenteditable="false">Các mẫu slide để đọc thêm</div><div class="drag-card" draggable="true" data-key="ref" data-edit="" data-eid="e167" contenteditable="false">Danh mục toàn bộ công cụ AI</div><div class="drag-card" draggable="true" data-key="ref" data-edit="" data-eid="e165" contenteditable="false">Lịch sử các lý thuyết giáo dục</div></div></div><div class="actions"><button class="action primary check">Kiểm tra</button><button class="action ghost reset">Làm lại</button><span class="feedback good" aria-live="polite">Chính xác — bạn đã hoàn thiện mẫu.</span></div></div></div></div></section><section class="slide" data-title="AI đúng vai"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e170" contenteditable="false">04 · AI hỗ trợ</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">15 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e171" contenteditable="false">AI <span class="accent">đúng vai</span></h2><p class="subtitle" data-edit="" data-eid="e172" contenteditable="false">Trợ lý tạo nháp — người dạy chịu trách nhiệm.</p></header><div class="body grid3"><article class="card lift" data-component="" data-reveal="" style="--i:0;" data-cid="c48"><span class="num">01</span><h3 data-edit="" data-eid="e173" contenteditable="false">Lựa chọn dữ liệu</h3><p data-edit="" data-eid="e174" contenteditable="false">Chỉ trực quan hóa khi cần thấy thứ tự, so sánh, nguyên nhân, phân cấp hoặc lựa chọn.</p></article><article class="card lift" data-component="" data-reveal="" style="--i:1;--component-accent:var(--orange)" data-cid="c49"><span class="num">02</span><h3 data-edit="" data-eid="e175" contenteditable="false">AI tạo bản nháp</h3><p data-edit="" data-eid="e176" contenteditable="false">Người dạy sửa nội dung, thuật ngữ, dữ liệu, đáp án và mức độ phù hợp.</p></article><article class="card lift" data-component="" data-reveal="" style="--i:2;" data-cid="c50"><span class="num">03</span><h3 data-edit="" data-eid="e177" contenteditable="false">Dữ liệu an toàn</h3><p data-edit="" data-eid="e178" contenteditable="false">Chỉ dùng dữ liệu giả lập hoặc công khai; không tải dữ liệu mật hay chưa được phép.</p></article></div><div class="quote" data-edit="" data-eid="e179" contenteditable="false">Rõ mục đích · Kiểm tra đầu ra · Bảo vệ dữ liệu</div></div></section><section class="slide warm" data-title="Mục tiêu quyết định hình thức"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e180" contenteditable="false">04 · Tương tác</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">16 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e181" contenteditable="false">Chọn hoạt động phù hợp với mục tiêu</h2><p class="subtitle" data-edit="" data-eid="e182" contenteditable="false">Đừng chọn công cụ trước. Hãy xác định người học cần đạt điều gì, rồi chọn hoạt động phù hợp.</p></header><div class="body activity-shell"><aside class="brief custom-cursor-on-hover" data-component="" data-cid="c51"><span class="pill">Bài tập kéo–thả</span><h3 data-edit="" data-eid="e183" contenteditable="false">Ghép hoạt động với mục tiêu học tập</h3><p data-edit="" data-eid="e184" contenteditable="false">Mỗi hoạt động giúp kiểm tra một loại kết quả khác nhau: hiểu kiến thức mới, thực hành kỹ năng, chia sẻ kinh nghiệm hoặc xử lý khi không có mạng</p></aside><div class="workspace" data-activity=""><div class="bank"><div class="drag-card" draggable="true" data-key="new" data-edit="" data-eid="e185" contenteditable="false">Hỏi nhanh + minh họa</div><div class="drag-card" draggable="true" data-key="skill" data-edit="" data-eid="e186" contenteditable="false">Làm một phần việc thật + phản hồi</div><div class="drag-card" draggable="true" data-key="experience" data-edit="" data-eid="e187" contenteditable="false">Phân tích tình huống + so sánh xử lý</div><div class="drag-card" draggable="true" data-key="offline" data-edit="" data-eid="e188" contenteditable="false">Thẻ A/B/C + trao đổi cặp</div></div><div class="drop-grid" style=""><div class="drop-zone" data-accept="new"><span class="drop-label">Kiến thức mới</span></div><div class="drop-zone" data-accept="skill"><span class="drop-label">Kỹ năng</span></div><div class="drop-zone" data-accept="experience"><span class="drop-label">Lớp giàu kinh nghiệm</span></div><div class="drop-zone" data-accept="offline"><span class="drop-label">Khi mất mạng</span></div></div><div class="actions"><button class="action primary check">Kiểm tra</button><button class="action ghost reset">Làm lại</button><span class="feedback" aria-live="polite"></span></div></div></div></div></section><section class="slide dark" data-title="Bốn nguyên tắc đứng lớp"><div class="mesh"></div><div class="slash"></div><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e189" contenteditable="false">05 · Dẫn dắt lớp</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">17 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e190" contenteditable="false">Bốn nguyên tắc <span class="accent">đứng lớp</span></h2><p class="subtitle" data-edit="" data-eid="e191" contenteditable="false">Lớp học có nhịp khi người học được nghĩ, nói và làm.</p></header><div class="body grid4"><article class="card lift" data-component="" data-reveal="" style="--i:0;" data-cid="c52"><span class="num">01</span><h3 data-edit="" data-eid="e192" contenteditable="false">Thu hút bằng vấn đề thật</h3><p data-edit="" data-eid="e193" contenteditable="false">Tình huống, lựa chọn khó, lỗi thường gặp hoặc kết quả bất ngờ.</p></article><article class="card lift" data-component="" data-reveal="" style="--i:1;--component-accent:var(--orange)" data-cid="c53"><span class="num">02</span><h3 data-edit="" data-eid="e194" contenteditable="false">Hỏi để người học suy nghĩ</h3><p data-edit="" data-eid="e195" contenteditable="false">Câu hỏi cụ thể, có thời gian nghĩ và có câu hỏi tiếp về lý do.</p></article><article class="card lift" data-component="" data-reveal="" style="--i:2;" data-cid="c54"><span class="num">03</span><h3 data-edit="" data-eid="e196" contenteditable="false">Cho làm và phản hồi ngay</h3><p data-edit="" data-eid="e197" contenteditable="false">Yêu cầu quyết định, sửa, thử hoặc giải thích sau phần trình bày.</p></article><article class="card lift" data-component="" data-reveal="" style="--i:3;--component-accent:var(--orange)" data-cid="c55"><span class="num">04</span><h3 data-edit="" data-eid="e198" contenteditable="false">Tạo không khí an toàn</h3><p data-edit="" data-eid="e199" contenteditable="false">Tạo không gian để mọi người chia sẻ, thử nghiệm và được lắng nghe.</p></article></div></div></section><section class="slide aqua" data-title="Dẫn dắt bằng câu hỏi"><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e200" contenteditable="false">05 · Dẫn dắt lớp</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">18 / 19</span></div><div class="content"><header class="head"><h2 class="title" data-edit="" data-eid="e201" contenteditable="false">Dẫn dắt lớp học bằng <span class="orange">câu hỏi</span></h2></header><div class="body split"><div class="ladder"><article class="step" data-component="" data-cid="c56"><span class="num">1</span><h3 data-edit="" data-eid="e202" contenteditable="false">Hỏi kinh nghiệm</h3><p data-edit="" data-eid="e203" contenteditable="false">Đã gặp tình huống tương tự ở đâu?</p></article><article class="step" data-component="" data-cid="c57"><span class="num">2</span><h3 data-edit="" data-eid="e204" contenteditable="false">Quan sát</h3><p data-edit="" data-eid="e205" contenteditable="false">Chi tiết nào đáng chú ý nhất?</p></article><article class="step" data-component="" data-cid="c58"><span class="num">3</span><h3 data-edit="" data-eid="e206" contenteditable="false">Tìm lý do</h3><p data-edit="" data-eid="e207" contenteditable="false">Vì sao cách này hiệu quả hoặc chưa hiệu quả?</p></article><article class="step" data-component="" data-cid="c59"><span class="num">4</span><h3 data-edit="" data-eid="e208" contenteditable="false">Lựa chọn</h3><p data-edit="" data-eid="e209" contenteditable="false">Nếu điều kiện đổi, chọn phương án nào?</p></article><article class="step" data-component="" data-cid="c60"><span class="num">5</span><h3 data-edit="" data-eid="e210" contenteditable="false">Áp dụng</h3><p data-edit="" data-eid="e211" contenteditable="false">Bước nào có thể thử ngay trong công việc?</p></article></div><div style="display:grid;gap:1vw"><article class="card lift" data-component="" data-cid="c61"><span class="pill">Giữ nhịp</span><h3 data-edit="" data-eid="e212" contenteditable="false">Đổi nhịp sau 15–20 phút</h3><p data-edit="" data-eid="e213" contenteditable="false">Luôn tổng kết hoạt động · Lớp im lặng: nghĩ → cặp → chia sẻ.</p></article><article class="card" data-component="" style="--component-accent:var(--orange)" data-cid="c62"><h3 data-edit="" data-eid="e214" contenteditable="false">Khi một người nói nhiều</h3><p data-edit="" data-eid="e215" contenteditable="false">Cảm ơn → tóm tắt → mời góc nhìn khác.</p><div class="rule"></div><p data-edit="" data-eid="e216" contenteditable="false"><strong>Tránh hỏi:</strong> “Mọi người có hiểu không?”</p></article></div></div></div></section><section class="slide dark" data-title="Cam kết áp dụng"><div class="mesh"></div><div class="slash"></div><div class="orb a"></div><div class="orb b"></div><div class="top"><span class="tag"><span data-edit="" data-eid="e217" contenteditable="false">Hoạt động 5 phút · Cam kết áp dụng</span></span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">19 / 19</span></div><div class="content"><div class="commit"><div class="commit-copy"><p class="eyebrow" data-edit="" data-eid="e218" contenteditable="false">Buổi dạy tiếp theo</p><h2 class="title xl" data-edit="" data-eid="e219" contenteditable="false">Tôi sẽ <span class="accent">thử…</span></h2><p class="subtitle" data-edit="" data-eid="e220" contenteditable="false">Sắp xếp ba mảnh ghép để tạo một cam kết đủ cụ thể.</p><p class="quote" data-edit="" style="margin-top:1em" data-eid="e221" contenteditable="false">Học xong khi bắt đầu làm khác đi.</p></div><div class="commit-panel"><div class="workspace" data-activity=""><div class="bank"></div><div class="drop-grid" style="grid-template-columns:1fr"><div class="drop-zone" data-accept="open"><span class="drop-label">01 · Một câu mở đầu</span><div class="drag-card" draggable="true" data-key="open" data-edit="" data-eid="e222" contenteditable="false">Mở bằng một vấn đề thật của người học</div></div><div class="drop-zone" data-accept="question"><span class="drop-label">02 · Một câu hỏi</span><div class="drag-card" draggable="true" data-key="question" data-edit="" data-eid="e223" contenteditable="false">Hỏi để người học lựa chọn và giải thích</div></div><div class="drop-zone" data-accept="action"><span class="drop-label">03 · Một hoạt động</span><div class="drag-card" draggable="true" data-key="action" data-edit="" data-eid="e224" contenteditable="false">Cho làm và nhận phản hồi ngay</div></div></div><div class="actions"><button class="action primary check">Kiểm tra</button><button class="action ghost reset">Làm lại</button><span class="feedback bad">Chưa đúng hết. Hãy quan sát nhãn ô và thử lại.</span></div></div><div class="rule"></div><p class="micro" data-edit="" style="color:#ffffffa3" data-eid="e225" contenteditable="false">Ví dụ: “Tôi sẽ thay 10 phút thuyết trình bằng một tình huống để người học lựa chọn, giải thích và nhận phản hồi.”</p></div></div></div></section></div></main>

function setupVoter(session){
  document.body.classList.add("voting-mode");
  const screen=document.getElementById("voteScreen"),card=screen.querySelector(".vote-card"),status=document.getElementById("voteStatus"),buttons=[...document.querySelectorAll(".vote-option")],submit=document.getElementById("voteSubmit"),retry=document.getElementById("voteRetry"),thanks=document.getElementById("voteThanks");
  screen.setAttribute("aria-hidden","false");
  let selected="";
  const voter=localStorage.getItem("pvep-voter-id")||("v-"+makeSessionId());
  localStorage.setItem("pvep-voter-id",voter);
  const submittedKey="pvep-poll-submitted-"+session;
  function label(t,cls=""){status.className="vote-status "+cls;status.querySelector("span:last-child").textContent=t}
  function showThanks(previous=false){localStorage.setItem(submittedKey,"1");card.classList.add("submitted");thanks.hidden=false;if(previous)thanks.querySelector("p").textContent="Câu trả lời của bạn đã được ghi nhận trước đó."}
  async function sendVote(){
    if(!selected)return label("Hãy chọn một phương án trước khi gửi.","error");
    submit.disabled=true;buttons.forEach(b=>b.disabled=true);retry.style.display="none";label("Đang gửi câu trả lời…","sending");
    try{
      const res=await fetch(POLL_SUBMIT_API,{method:"POST",headers:{...POLL_HEADERS,"Content-Type":"application/json"},body:JSON.stringify({p_session_id:session,p_voter_id:voter,p_choice:selected})});
      const data=await res.json().catch(()=>null);
      if(!res.ok)throw new Error(data?.message||data?.error||"Không gửi được câu trả lời.");
      showThanks(data===false);
    }catch(e){buttons.forEach(b=>b.disabled=false);submit.disabled=false;retry.style.display="inline-flex";label("Chưa gửi được. Kiểm tra mạng rồi thử lại.","error")}
  }
  if(!validSession(session)){buttons.forEach(b=>b.disabled=true);submit.disabled=true;label("Mã phiên không hợp lệ. Vui lòng quét lại QR.","error");return}
  if(localStorage.getItem(submittedKey)){showThanks(true);return}
  buttons.forEach(b=>b.onclick=()=>{selected=b.dataset.vote;buttons.forEach(x=>x.classList.toggle("selected",x===b));submit.disabled=false;label("Đã chọn · nhấn Gửi câu trả lời.")});
  submit.onclick=sendVote;retry.onclick=sendVote;label("Chọn một phương án để tiếp tục.");
}
document.getElementById("startPollBtn")?.addEventListener("click",()=>startLivePoll());document.getElementById("newPollBtn")?.addEventListener("click",()=>startLivePoll(true));document.getElementById("copyJoinBtn")?.addEventListener("click",async()=>{if(!pollJoinUrl)return toast("Phiên chưa sẵn sàng");try{await navigator.clipboard.writeText(pollJoinUrl);toast("Đã sao chép link tham gia")}catch{prompt("Sao chép link này:",pollJoinUrl)}});syncPollForm();renderPoll();

const pollParams=new URLSearchParams(location.search);if(pollParams.get("poll")==="join"&&pollParams.get("session")){setupVoter(pollParams.get("session"));return}
let h=+(location.hash.match(/slide-(\d+)/)||[])[1];show(h?Math.min(h-1,slides.length-1):0);
})();
</script>
