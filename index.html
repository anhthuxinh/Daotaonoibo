<aside class="editor" id="editor"><h4>Studio chỉnh sửa</h4><p>Bấm vào chữ để sửa. Chọn một thẻ/shape để đổi màu, cỡ chữ hoặc dịch chuyển.</p><div class="edit-row"><button id="fontDown">Chữ −</button><button id="fontUp">Chữ +</button><button id="moveUp">↑</button><button id="moveDown">↓</button><button id="moveLeft">←</button><button id="moveRight">→</button></div><div class="edit-row"><button class="swatch" data-color="#16bfd4" style="background:#16bfd4" title="Cyan"></button><button class="swatch" data-color="#f58220" style="background:#f58220" title="Cam"></button><button class="swatch" data-color="#087bb5" style="background:#087bb5" title="Xanh"></button><button class="swatch" data-color="#7b61ff" style="background:#7b61ff" title="Tím"></button><button id="resetComponent">Đặt lại ô</button></div><button class="download" id="downloadBtn">Tải HTML đã chỉnh</button><button class="reset-all" id="resetAll">Xóa mọi chỉnh sửa đã lưu</button></aside>

const E=x=>`<span data-edit>${x}</span>`,decor=d=>d.theme==="dark"?'<div class="mesh"></div><div class="slash"></div><div class="orb a"></div><div class="orb b"></div>':'<div class="orb a"></div><div class="orb b"></div>';
const top=(d,i)=>`<div class="top"><span class="tag">${E(d.tag||"Chương trình giảng viên nội bộ")}</span><div class="brand"><span class="mark"></span>PVEP</div><span class="page">${String(i+1).padStart(2,"0")} / ${S.length}</span></div>`;
const head=d=>`<header class="head"><h2 class="title" data-edit>${d.title}</h2>${d.sub?`<p class="subtitle" data-edit>${d.sub}</p>`:""}</header>`;
const card=(it,i,label)=>`<article class="card lift" data-component data-reveal style="--i:${i};${i%2?"--component-accent:var(--orange)":""}"><span class="num">${label||String(i+1).padStart(2,"0")}</span><h3 data-edit>${it[0]}</h3><p data-edit>${it[1]}</p>${it[2]?`<div class="rule"></div><span class="pill" data-edit>${it[2]}</span>`:""}</article>`;
function activity(d){return `<div class="body activity-shell"><aside class="brief" data-component><span class="pill">Bài tập kéo–thả</span><h3 data-edit>${d.brief?.[0]||"Sắp xếp các mảnh ghép."}</h3><p data-edit>${d.brief?.[1]||"Kéo thẻ hoặc bấm thẻ rồi bấm ô đích."}</p></aside><div class="workspace" data-activity><div class="bank">${d.cards.map(c=>`<div class="drag-card" draggable="true" data-key="${c[0]}" data-edit>${c[1]}</div>`).join("")}</div><div class="drop-grid" style="${d.cols?`grid-template-columns:repeat(${d.cols},1fr)`:d.zones.length===3?"grid-template-columns:1fr":""}">${d.zones.map(z=>`<div class="drop-zone" data-accept="${z[0]}"><span class="drop-label">${z[1]}</span></div>`).join("")}</div><div class="actions"><button class="action primary check">Kiểm tra</button><button class="action ghost reset">Làm lại</button><span class="feedback" aria-live="polite"></span></div></div></div>`}
function body(d){
if(d.type==="hero")return `<img class="hero-photo" src="assets/offshore-platform.jpg" alt="Giàn khai thác dầu khí ngoài khơi"><div class="hero-shade"></div><div class="hero-copy"><div class="hero-kicker" data-reveal data-edit>Chương trình phát triển giảng viên nội bộ</div><h1 class="title xl" data-reveal data-edit style="--i:1;margin-top:.3em">${d.title}</h1><p class="subtitle" data-reveal data-edit style="--i:2">${d.sub}</p><div class="hero-meta" data-reveal style="--i:3"><span data-edit>03 giờ</span><span data-edit>Thực hành trọng tâm</span></div></div>`;
if(d.type==="timeline")return `${head(d)}<div class="body" style="grid-template-rows:1fr auto"><div class="timeline">${d.items.map((x,i)=>`<div class="stop" data-component data-reveal style="--i:${i}"><span class="num">${x[0]}</span><strong data-edit>${x[1]}</strong><small data-edit>${x[2]}</small></div>`).join("")}</div><div class="quote" data-reveal data-edit style="--i:5">Đích đến: Chọn đúng chủ đề · Thiết kế dàn bài · Dẫn dắt để người học làm được</div></div>`;
if(d.type==="venn")return `${head(d)}<div class="body split"><div class="venn" data-reveal><div class="circle c1" data-component data-edit>Tôi có<br>kinh nghiệm</div><div class="circle c2" data-component data-edit>Người học<br>đang cần</div><div class="circle c3" data-component data-edit>Có thể<br>áp dụng</div><div class="center" data-edit>CHỦ ĐỀ<br>ĐÁNG DẠY</div></div><div style="display:grid;gap:1vw"><div class="card lift" data-component data-reveal style="--i:2"><span class="pill">Câu hỏi mở khóa</span><p class="quote" data-edit style="margin-top:1em">Sau buổi học, người học sẽ làm được điều gì khác đi trong công việc?</p></div><div class="card" data-component data-reveal style="--i:3;--component-accent:var(--orange)"><p data-edit>Nếu chưa trả lời được bằng một hành động quan sát được, chủ đề vẫn còn quá rộng.</p></div></div></div>`;
if(d.type==="versus")return `${head(d)}<div class="body versus"><div class="side wide lift" data-component><span class="eyebrow">Phía người dạy</span><h3 data-edit>Điều tôi biết</h3><ul><li data-edit>Rộng</li><li data-edit>Nhiều chi tiết</li><li data-edit>Dễ dàn trải</li></ul></div><div class="sign">≠</div><div class="side focus lift" data-component><span class="eyebrow">Phía người học</span><h3 data-edit>Điều cần học</h3><ul><li data-edit>Một việc</li><li data-edit>Một thay đổi</li><li data-edit>Một bằng chứng</li></ul></div></div><div class="quote" data-edit style="margin-top:1vw">Đừng dạy “toàn bộ chủ đề”. Hãy dạy đúng phần giúp người học hoàn thành một nhiệm vụ cụ thể.</div>`;
if(d.type==="cards")return `${head(d)}<div class="body grid${d.cols}">${d.items.map((x,i)=>card(x,i,d.labels?.[i])).join("")}</div>${d.foot?`<div class="${d.cols===3?"quote":"micro"}" data-edit>${d.foot}</div>`:""}`;
if(d.type==="activity")return `${head(d)}${activity(d)}`;
if(d.type==="framework")return `${head(d)}<div class="body"><div class="framework">${d.items.map((x,i)=>`<article class="unit" data-component><div class="letter">${i===3?"H":"W"}</div><h3 data-edit>${x[0]}</h3><p data-edit>${x[1]}</p></article>`).join("")}</div><div class="quote" data-edit>Thiết kế từ WHY và WHEN trước khi mở PowerPoint.</div></div>`;
if(d.type==="formula")return `${head(d)}<div class="body formula"><article class="block" data-component><div class="big">1</div><div><h3 data-edit>Thông điệp</h3><p data-edit>Nếu chỉ nhớ một điều, đó là gì?</p></div></article><div class="plus">+</div><article class="block mid" data-component><div class="big">3</div><div><h3 data-edit>Ý hỗ trợ</h3><p data-edit>Tối đa ba bước, lý do, bằng chứng hoặc nguyên tắc.</p></div></article><div class="plus">+</div><article class="block" data-component><div class="big">1</div><div><h3 data-edit>Việc phải làm</h3><p data-edit>Trả lời, lựa chọn, sửa, sắp xếp hoặc thực hành.</p></div></article></div><div class="quote" data-edit>Một thông điệp rõ + vừa đủ hỗ trợ + một hành động tạo bằng chứng.</div>`;
if(d.type==="ladder"){let q=[["Hỏi kinh nghiệm","Đã gặp tình huống tương tự ở đâu?"],["Quan sát","Chi tiết nào đáng chú ý nhất?"],["Tìm lý do","Vì sao cách này hiệu quả hoặc chưa hiệu quả?"],["Lựa chọn","Nếu điều kiện đổi, chọn phương án nào?"],["Áp dụng","Bước nào có thể thử ngay trong công việc?"]];return `${head(d)}<div class="body split"><div class="ladder">${q.map((x,i)=>`<article class="step" data-component><span class="num">${i+1}</span><h3 data-edit>${x[0]}</h3><p data-edit>${x[1]}</p></article>`).join("")}</div><div style="display:grid;gap:1vw"><article class="card lift" data-component><span class="pill">Giữ nhịp</span><h3 data-edit>Đổi nhịp sau 15–20 phút</h3><p data-edit>Luôn tổng kết hoạt động · Lớp im lặng: nghĩ → cặp → chia sẻ.</p></article><article class="card" data-component style="--component-accent:var(--orange)"><h3 data-edit>Khi một người nói nhiều</h3><p data-edit>Cảm ơn → tóm tắt → mời góc nhìn khác.</p><div class="rule"></div><p data-edit><strong>Tránh hỏi:</strong> “Mọi người có hiểu không?”</p></article></div></div>`}
if(d.type==="commit")return `<div class="commit"><div class="commit-copy"><p class="eyebrow" data-edit>Buổi dạy tiếp theo</p><h2 class="title xl" data-edit>${d.title}</h2><p class="subtitle" data-edit>${d.sub}</p><p class="quote" data-edit style="margin-top:1em">Học xong khi bắt đầu làm khác đi.</p></div><div class="commit-panel"><div class="workspace" data-activity><div class="bank">${d.cards.map(c=>`<div class="drag-card" draggable="true" data-key="${c[0]}" data-edit>${c[1]}</div>`).join("")}</div><div class="drop-grid" style="grid-template-columns:1fr">${d.zones.map(z=>`<div class="drop-zone" data-accept="${z[0]}"><span class="drop-label">${z[1]}</span></div>`).join("")}</div><div class="actions"><button class="action primary check">Kiểm tra</button><button class="action ghost reset">Làm lại</button><span class="feedback"></span></div></div><div class="rule"></div><p class="micro" data-edit style="color:#ffffffa3">Ví dụ: “Tôi sẽ thay 10 phút thuyết trình bằng một tình huống để người học lựa chọn, giải thích và nhận phản hồi.”</p></div></div>`;
}
const deck=document.getElementById("deck");if(!deck.children.length)deck.innerHTML=S.map((d,i)=>`<section class="slide ${d.theme||""} ${i===0?"active":""}" data-title="${d.t}">${decor(d)}${top(d,i)}<div class="content">${body(d)}</div></section>`).join("");
const slides=[...document.querySelectorAll(".slide")],count=document.getElementById("count"),progress=document.getElementById("progress"),key="pvep-deck-v4";let current=0,edit=false,selected=null,dragged=null,clicked=null;
document.querySelectorAll("[data-component]").forEach((x,i)=>x.dataset.cid="c"+i);document.querySelectorAll("[data-edit]").forEach((x,i)=>x.dataset.eid="e"+i);
const toast=t=>{let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove("show"),1800)};
function show(n){if(edit)return;n=(n+slides.length)%slides.length;slides[current].classList.remove("active");current=n;slides[current].classList.add("active");count.textContent=String(current+1).padStart(2,"0")+" / "+slides.length;progress.style.width=(current+1)/slides.length*100+"%";history.replaceState(null,"","#slide-"+(current+1))}
document.getElementById("prev").onclick=()=>show(current-1);document.getElementById("next").onclick=()=>show(current+1);document.getElementById("full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener("keydown",e=>{if(e.target.isContentEditable)return;if(["ArrowRight","PageDown"," "].includes(e.key))show(current+1);if(["ArrowLeft","PageUp"].includes(e.key))show(current-1);if(e.key.toLowerCase()==="f")document.getElementById("full").click();if(e.key.toLowerCase()==="e")document.getElementById("editBtn").click()});let sx=0;deck.addEventListener("pointerdown",e=>sx=e.clientX);deck.addEventListener("pointerup",e=>{if(!edit&&Math.abs(e.clientX-sx)>70)show(current+(e.clientX<sx?1:-1))});
const map=document.getElementById("map"),grid=document.getElementById("mapGrid");slides.forEach((s,i)=>{let b=document.createElement("button");b.className="action ghost";b.style.textAlign="left";b.textContent=String(i+1).padStart(2,"0")+" · "+s.dataset.title;b.onclick=()=>{map.close();show(i)};grid.appendChild(b)});document.getElementById("mapBtn").onclick=()=>map.showModal();document.getElementById("closeMap").onclick=()=>map.close();
function save(){let o={texts:{},styles:{}};document.querySelectorAll("[data-edit]").forEach(x=>o.texts[x.dataset.eid]=x.innerHTML);document.querySelectorAll("[data-component]").forEach(x=>o.styles[x.dataset.cid]=x.getAttribute("style")||"");localStorage.setItem(key,JSON.stringify(o))}
function load(){try{let o=JSON.parse(localStorage.getItem(key)||"{}");Object.entries(o.texts||{}).forEach(([k,v])=>{let x=document.querySelector(`[data-eid="${k}"]`);if(x)x.innerHTML=v});Object.entries(o.styles||{}).forEach(([k,v])=>{let x=document.querySelector(`[data-cid="${k}"]`);if(x)x.setAttribute("style",v)})}catch(e){}}load();document.querySelectorAll("[data-edit]").forEach(x=>x.addEventListener("input",()=>{clearTimeout(x._s);x._s=setTimeout(save,350)}));
const editBtn=document.getElementById("editBtn"),editor=document.getElementById("editor");editBtn.onclick=()=>{edit=!edit;document.body.classList.toggle("edit-mode",edit);editor.classList.toggle("open",edit);editBtn.classList.toggle("on",edit);editBtn.textContent=edit?"✓ Xong":"✎ Chỉnh sửa";document.querySelectorAll("[data-edit]").forEach(x=>x.contentEditable=edit);if(!edit){selected?.classList.remove("component-selected");selected=null;save();toast("Đã lưu trên trình duyệt")}};document.addEventListener("click",e=>{if(!edit)return;let c=e.target.closest("[data-component]");if(c){selected?.classList.remove("component-selected");selected=c;c.classList.add("component-selected");e.stopPropagation()}});
function alter(dx,dy,fs){if(!selected)return toast("Hãy chọn một ô hoặc shape");let x=(+selected.dataset.x||0)+dx,y=(+selected.dataset.y||0)+dy;selected.dataset.x=x;selected.dataset.y=y;selected.style.transform=`translate(${x}px,${y}px)`;if(fs)selected.style.fontSize=Math.max(8,parseFloat(getComputedStyle(selected).fontSize)+fs)+"px";save()}document.getElementById("moveUp").onclick=()=>alter(0,-8,0);document.getElementById("moveDown").onclick=()=>alter(0,8,0);document.getElementById("moveLeft").onclick=()=>alter(-8,0,0);document.getElementById("moveRight").onclick=()=>alter(8,0,0);document.getElementById("fontDown").onclick=()=>alter(0,0,-1);document.getElementById("fontUp").onclick=()=>alter(0,0,1);document.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>{if(!selected)return toast("Hãy chọn một ô hoặc shape");selected.style.setProperty("--component-accent",b.dataset.color);save()});document.getElementById("resetComponent").onclick=()=>{if(!selected)return;selected.removeAttribute("style");delete selected.dataset.x;delete selected.dataset.y;save();toast("Đã đặt lại thành phần")};document.getElementById("resetAll").onclick=()=>{if(confirm("Xóa toàn bộ nội dung và định dạng đã chỉnh trên trình duyệt này?")){localStorage.removeItem(key);location.reload()}};
document.getElementById("downloadBtn").onclick=()=>{save();let c=document.documentElement.cloneNode(true);c.querySelector("body").classList.remove("edit-mode");c.querySelectorAll("[contenteditable]").forEach(x=>x.setAttribute("contenteditable","false"));c.querySelectorAll(".component-selected").forEach(x=>x.classList.remove("component-selected"));c.querySelector("#editor").classList.remove("open");c.querySelector("#editBtn").classList.remove("on");c.querySelector("#editBtn").textContent="✎ Chỉnh sửa";let blob=new Blob(["<!doctype html>\n"+c.outerHTML],{type:"text/html;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Đã tải index.html")};
document.querySelectorAll(".drag-card").forEach(c=>{c.addEventListener("dragstart",()=>{if(edit)return;dragged=c;c.classList.add("dragging")});c.addEventListener("dragend",()=>{c.classList.remove("dragging");dragged=null});c.addEventListener("click",e=>{if(edit)return;clicked?.classList.remove("component-selected");clicked=c;c.classList.add("component-selected");e.stopPropagation()})});document.querySelectorAll(".drop-zone").forEach(z=>{z.addEventListener("dragover",e=>{if(edit)return;e.preventDefault();z.classList.add("over")});z.addEventListener("dragleave",()=>z.classList.remove("over"));z.addEventListener("drop",e=>{if(edit)return;e.preventDefault();z.classList.remove("over");if(dragged)z.appendChild(dragged)});z.addEventListener("click",()=>{if(edit||!clicked)return;z.appendChild(clicked);clicked.classList.remove("component-selected");clicked=null})});document.querySelectorAll(".workspace[data-activity]").forEach(w=>{let bank=w.querySelector(".bank"),fb=w.querySelector(".feedback");w.querySelector(".check").onclick=()=>{let total=0,ok=0;w.querySelectorAll(".drop-zone").forEach(z=>{z.classList.remove("correct","wrong");let cards=[...z.querySelectorAll(".drag-card")];total+=cards.length;let good=cards.length&&cards.every(c=>c.dataset.key===z.dataset.accept);if(good){z.classList.add("correct");ok+=cards.length}else if(cards.length)z.classList.add("wrong")});let all=w.querySelectorAll(".drag-card").length;if(ok===all&&total===all){fb.textContent="Chính xác — bạn đã hoàn thiện mẫu.";fb.className="feedback good"}else{fb.textContent="Chưa đúng hết. Hãy quan sát nhãn ô và thử lại.";fb.className="feedback bad"}};w.querySelector(".reset").onclick=()=>{w.querySelectorAll(".drag-card").forEach(c=>bank.appendChild(c));w.querySelectorAll(".drop-zone").forEach(z=>z.classList.remove("correct","wrong"));fb.textContent="";fb.className="feedback"}});
let h=+(location.hash.match(/slide-(\d+)/)||[])[1];show(h?Math.min(h-1,slides.length-1):0);
})();
</script>
</body></html>
